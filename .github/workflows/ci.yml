name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t git-sms:ci .
      - name: Refuses to start without production configuration
        run: |
          set +e
          docker run --rm git-sms:ci > out.txt 2>&1
          status=$?
          cat out.txt
          test "$status" -ne 0 && grep -q "TWILIO_AUTH_TOKEN" out.txt
      - name: Serves health in development mode
        run: |
          docker run -d --name gs -p 8000:8000 -e GIT_SMS_ENV=development -e GIT_SMS_SENDER=console git-sms:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs gs; exit 1
